name: Build NAS compare preview (no registry publish)
on:
  push:
    branches: [nas-management-compare-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nas-compare-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test BitQiu protocol and state transitions
        run: |
          task_test_status=0
          go test -race ./drivers/bitqiu || task_test_status=1
          go test -race ./internal/op -run '^TestPendingLoginCanBeCreatedAndEdited$' || task_test_status=1
          go test -race ./server/handles -run '^Test(BitQiuNASIntegration|NASTaskInfo)$' || task_test_status=1
          go test -race ./internal/fs -run '^TestNAS' || task_test_status=1
          go test -race ./internal/task || task_test_status=1
          go test -race ./server/nasui || task_test_status=1
          node --test scripts/nas-ui.test.cjs scripts/nas-picker.test.cjs || task_test_status=1
          exit "$task_test_status"
      - name: Download matching official frontend
        run: |
          curl --fail --location --retry 3 https://github.com/AlistGo/alist-web/releases/download/3.65.0/dist.tar.gz -o /tmp/frontend.tar.gz
          tar -xzf /tmp/frontend.tar.gz -C public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official login and navigation to NAS downloads
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
          python scripts/test-downloads-mount.py
          python scripts/test-alist-login.py
          python scripts/test-nas-browser.py
          python scripts/test-nas-stream.py
          python scripts/test-nas-auth.py
          python scripts/test-nas-picker.py
          python scripts/test-nas-compare.py
      - name: Install musl toolchain for static SQLite support
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Build linux amd64 binary
        run: bash scripts/build-bitqiu.sh
      - name: Build image using pinned official runtime
        run: |
          docker pull --platform linux/amd64 xhofe/alist@sha256:499313cdb00ec53f60d9f00167df4ea737ca7f94f0d822673330f55bff8c9bfc
          docker build --platform linux/amd64 -f Dockerfile.bitqiu --build-arg VCS_REF="$GITHUB_SHA" -t alist-bitqiu:compare-${GITHUB_SHA::12} .
      - name: Smoke test amd64 image
        run: bash scripts/smoke-bitqiu.sh alist-bitqiu:compare-${GITHUB_SHA::12}
      - name: Export preview artifacts without publishing
        run: |
          mkdir -p preview
          docker save alist-bitqiu:compare-${GITHUB_SHA::12} | gzip > preview/alist-bitqiu-compare-linux-amd64-image.tar.gz
          tar -czf preview/alist-bitqiu-compare-linux-amd64-binary.tar.gz -C build alist
          printf '%s\n' "$GITHUB_SHA" > preview/COMMIT
          (cd preview && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: alist-bitqiu-compare-linux-amd64
          path: preview/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-browser-previews
          path: /tmp/alist-nas-ui/
          if-no-files-found: ignore
