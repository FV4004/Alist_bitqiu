name: Check NAS management changes
on:
  push:
    branches: ['nas-management-*', '!nas-management-compare-preview']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test NAS backend with race detector
        run: |
          go test -race ./drivers/bitqiu
          go test -race ./internal/fs -run '^TestNAS'
          go test -race ./server/handles -run '^Test(BitQiuNASIntegration|NASTaskInfo)$'
          go test -race ./server/nasui
          node --test scripts/nas-ui.test.cjs scripts/nas-picker.test.cjs
      - name: Download matching official frontend
        run: |
          curl --fail --location --retry 3 https://github.com/AlistGo/alist-web/releases/download/3.65.0/dist.tar.gz -o /tmp/frontend.tar.gz
          tar -xzf /tmp/frontend.tar.gz -C public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test NAS and official login in Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
          browser_test_status=0
          python scripts/test-downloads-mount.py || browser_test_status=1
          python scripts/test-alist-login.py || browser_test_status=1
          python scripts/test-nas-browser.py || browser_test_status=1
          python scripts/test-nas-stream.py || browser_test_status=1
          python scripts/test-nas-auth.py || browser_test_status=1
          python scripts/test-nas-picker.py || browser_test_status=1
          exit "$browser_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nas-management-browser-previews
          path: /tmp/alist-nas-ui/
          if-no-files-found: ignore
