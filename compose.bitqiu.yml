services:
  alist:
    image: ghcr.io/fv4004/alist_bitqiu:latest
    platform: linux/amd64
    container_name: alist-bitqiu
    restart: unless-stopped
    ports:
      - "5244:5244"
      - "5245:5245"
    volumes:
      - ./data:/opt/alist/data
      # Set an existing NAS folder explicitly; never create a silent fallback.
      - type: bind
        source: ${NAS_DOWNLOAD_DIR:?请设置 NAS_DOWNLOAD_DIR 为已存在的 NAS 文件夹绝对路径}
        target: /downloads
        bind:
          create_host_path: false
    environment:
      PUID: "0"
      PGID: "0"
      UMASK: "022"
      TZ: Asia/Shanghai
